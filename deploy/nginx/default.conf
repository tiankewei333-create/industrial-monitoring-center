server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy realtime WebSocket (same-origin /ws)
  location /ws {
    proxy_pass http://realtime:3002/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Proxy API (login / assets / alarms)
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Optional health passthrough for debugging
  location /realtime-health {
    proxy_pass http://realtime:3002/health;
  }
}
