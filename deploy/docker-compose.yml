# IMC · Docker Compose
# Infra (default):  postgres redis mosquitto
# MVP apps:         docker compose --profile mvp up -d --build
#
#   cp .env.example .env
#   npm run docker:mvp

name: imc

services:
  postgres:
    image: postgres:16-alpine
    container_name: imc-postgres
    restart: unless-stopped
    profiles: ["infra", "full", "mvp"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-imc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - imc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imc} -d ${POSTGRES_DB:-imc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: imc-timescale
    restart: unless-stopped
    profiles: ["infra", "timeseries", "mvp", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imc_dev_password}
      POSTGRES_DB: imc_ts
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - imc_ts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imc} -d imc_ts"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: imc-redis
    restart: unless-stopped
    profiles: ["infra", "full"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - imc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: imc-mosquitto
    restart: unless-stopped
    user: root
    profiles: ["mvp", "full", "infra"]
    environment:
      MQTT_USER: ${MQTT_USER:-imc}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-imc_mqtt_password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mosquitto_passwd -b -c /tmp/passwd "$${MQTT_USER}" "$${MQTT_PASSWORD}"
        chmod 0400 /tmp/passwd
        printf '%s\n' \
          'listener 1883' \
          'allow_anonymous false' \
          'password_file /tmp/passwd' \
          'persistence true' \
          'persistence_location /mosquitto/data/' \
          'log_dest stdout' \
          > /tmp/mosquitto.conf
        exec mosquitto -c /tmp/mosquitto.conf
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - imc_mqtt_data:/mosquitto/data
      - imc_mqtt_log:/mosquitto/log

  realtime:
    build:
      context: ..
      dockerfile: apps/realtime/Dockerfile
    container_name: imc-realtime
    restart: unless-stopped
    profiles: ["mvp", "full"]
    environment:
      PORT: 3002
      IMC_EMBED_MQTT: "false"
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_TELEMETRY: ${MQTT_TOPIC_TELEMETRY:-imc/telemetry/#}
      HISTORY_MAX_POINTS: ${HISTORY_MAX_POINTS:-900}
      DATABASE_URL: postgres://${POSTGRES_USER:-imc}:${POSTGRES_PASSWORD:-imc_dev_password}@postgres:5432/${POSTGRES_DB:-imc}
      TIMESCALE_URL: postgres://${POSTGRES_USER:-imc}:${POSTGRES_PASSWORD:-imc_dev_password}@timescale:5432/imc_ts
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MQTT_USER: ${MQTT_USER:-imc}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-imc_mqtt_password}
      MQTT_USERNAME: ${MQTT_USER:-imc}
      NODE_ENV: production
    ports:
      - "${REALTIME_PORT:-3002}:3002"
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy

  simulator:
    build:
      context: ..
      dockerfile: apps/simulator/Dockerfile
    container_name: imc-simulator
    restart: unless-stopped
    profiles: ["mvp", "full"]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: ${MQTT_USER:-imc}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-imc_mqtt_password}
      MQTT_USERNAME: ${MQTT_USER:-imc}
      ASSET_ID: ${ASSET_ID:-Machine001}
      SIM_FLEET: ${SIM_FLEET:-all}
      SIM_INTERVAL_MS: ${SIM_INTERVAL_MS:-1000}
    depends_on:
      - mosquitto

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: imc-api
    restart: unless-stopped
    profiles: ["mvp", "full"]
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-imc}:${POSTGRES_PASSWORD:-imc_dev_password}@postgres:5432/${POSTGRES_DB:-imc}
      TIMESCALE_URL: postgres://${POSTGRES_USER:-imc}:${POSTGRES_PASSWORD:-imc_dev_password}@timescale:5432/imc_ts
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      IMC_ALLOW_DEFAULT_JWT: ${IMC_ALLOW_DEFAULT_JWT:-true}
      NODE_ENV: production
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: imc-web
    restart: unless-stopped
    profiles: ["mvp", "full"]
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - realtime
      - api

  # Placeholders until Nest ingest ships
  ingest:
    build:
      context: ..
      dockerfile: apps/ingest/Dockerfile
    container_name: imc-ingest
    restart: unless-stopped
    profiles: ["full"]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: ${MQTT_USER:-imc}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-imc_mqtt_password}
      MQTT_USERNAME: ${MQTT_USER:-imc}
    depends_on:
      - mosquitto

volumes:
  imc_pg_data:
  imc_ts_data:
  imc_redis_data:
  imc_mqtt_data:
  imc_mqtt_log:
